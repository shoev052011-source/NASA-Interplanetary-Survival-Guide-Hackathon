<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NASA Gale Crater Mars VR & Telemetry HUD</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 999;
            background: rgba(10, 15, 25, 0.3);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(0, 255, 200, 0.3);
            padding: 15px;
            border-radius: 8px;
            color: #00ffc8;
            width: 300px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #hud h2 { font-size: 16px; margin: 0 0 10px 0; text-transform: uppercase; letter-spacing: 1px; }
        .hud-control { margin-bottom: 10px; }
        .hud-control label { display: block; font-size: 12px; margin-bottom: 4px; color: #a0aec0; }
        .hud-control select, .hud-control button {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 200, 0.5);
            color: #fff;
            padding: 6px;
            border-radius: 4px;
            outline: none;
        }
        .hud-control select option { background: #111; color: #fff; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 8px; cursor: pointer; color: #e2e8f0; }
        .telemetry-data { font-family: monospace; font-size: 11px; margin-top: 10px; border-top: 1px solid rgba(0, 255, 200, 0.2); padding-top: 8px; color: #e2e8f0; }
    </style>
</head>
<body>
    <!-- Telemetry & Mission Control HUD -->
    <div id="hud">
        <h2>Mars Mission HUD</h2>
        <div class="hud-control">
            <label for="site-select">Gale Crater Site Selector</label>
            <select id="site-select">
                <option value="bradbury">Bradbury Landing</option>
                <option value="pahrump">Pahrump Hills</option>
                <option value="marias">Marias Pass</option>
                <option value="murray">Murray Buttes</option>
            </select>
        </div>
        
        <div class="hud-control">
            <label class="checkbox-group">
                <input type="checkbox" id="toggle-hazards"> Show 3D Hazard Rectangles
            </label>
            <label class="checkbox-group">
                <input type="checkbox" id="toggle-paths"> Show Safe Traverse Paths
            </label>
        </div>

        <div class="telemetry-data" id="telemetry-box">
            Status: Standby<br>
            Lat/Lon: 4.5895° S, 137.4417° E<br>
            Elevation: -4,500 m
        </div>
    </div>

    <!-- A-Frame Scene -->
    <a-scene embedded>
        <!-- Camera & Rig -->
        <a-entity id="rig" position="0 1.6 0">
            <a-camera id="camera" look-controls wasd-controls></a-camera>
        </a-entity>

        <!-- Mars Sky & Ambient Lighting -->
        <a-sky color="#b85d34"></a-sky>
        <a-light type="ambient" color="#fff" intensity="0.8"></a-light>
        <a-light type="directional" position="-1 2 1" intensity="0.6" color="#ffaa88"></a-light>

        <!-- Procedural Mars Terrain / Ground -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="200" height="200" color="#a64b2a" roughness="0.9"></a-plane>

        <!-- Dynamic Custom Layers Container -->
        <a-entity id="mars-layers"></a-entity>
    </a-scene>

    <!-- Custom JS Script -->
    <script src="js/mars-custom.js"></script>
</body>
</html>
